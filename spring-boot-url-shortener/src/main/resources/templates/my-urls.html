<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My URLs</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="section-heading mt-5">
            <div>
                <span class="section-kicker">Workspace</span>
                <h2>My shortened URLs</h2>
            </div>
        </div>
        <div th:if="${shortUrls.data.isEmpty()}" class="app-empty-state">
            <span class="section-kicker">Your workspace</span>
            <h3>No saved links yet</h3>
            <p>Short URLs you create while signed in will stay here, ready to copy, open, or manage.</p>
            <a class="hero-action hero-action-primary" th:href="@{/#create-short-url}">Create a short URL</a>
        </div>
        <div th:unless="${shortUrls.data.isEmpty()}" class="table-responsive app-table-wrap">
            <form id="deleteForm" th:action="@{/delete-urls}" method="post">
                <div class="my-urls-toolbar">
                    <p id="selectedUrlsStatus" class="mb-0" aria-live="polite">Select links to manage them.</p>
                    <button id="deleteSelectedBtn" type="button" class="btn btn-danger app-btn-danger" disabled>
                        Delete Selected
                    </button>
                </div>
                <table class="table table-hover app-table my-urls-table">
                    <thead>
                        <tr>
                            <th>
                                <input type="checkbox" id="selectAll" class="form-check-input"
                                       aria-label="Select all URLs">
                            </th>
                            <th>Short URL</th>
                            <th>Original URL</th>
                            <th>Created</th>
                            <th>Expires</th>
                            <th>Private</th>
                            <th>Clicks</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="url : ${shortUrls.data}">
                            <td>
                                <input type="checkbox" name="ids" th:value="${url.id}"
                                       class="form-check-input url-checkbox"
                                       th:attr="aria-label=${'Select ' + url.shortKey}">
                            </td>
                            <td>
                                <a th:href="@{/s/{key}(key=${url.shortKey})}"
                                   th:text="${baseUrl + '/s/' + url.shortKey}"
                                   target="_blank"></a>
                            </td>
                            <td>
                                <a th:href="${url.originalUrl}"
                                   th:text="${#strings.abbreviate(url.originalUrl, 50)}"
                                   target="_blank"></a>
                            </td>
                            <td th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm') : 'Never'}"></td>
                            <td>
                                <span th:if="${url.private}" class="badge app-badge app-badge-muted">Private</span>
                                <span th:unless="${url.private}" class="badge app-badge app-badge-success">Public</span>
                            </td>
                            <td th:text="${url.clickCount}"></td>
                            <td>
                                <div class="my-url-actions">
                                    <button type="button" class="btn app-copy-btn"
                                            th:attr="data-copy-url=${baseUrl + '/s/' + url.shortKey}">
                                        Copy
                                    </button>
                                    <a class="hero-action hero-action-secondary"
                                       th:href="@{/s/{key}(key=${url.shortKey})}"
                                       target="_blank"
                                       rel="noopener">
                                        Open
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
            <div th:insert="~{pagination}"></div>
        </div>
    </div>
</body>
</html>
