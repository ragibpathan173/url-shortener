<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Error</title>
</head>
<body>
<div layout:fragment="content">
    <section class="error-panel">
        <span class="section-kicker">500</span>
        <h1>Something went wrong</h1>
        <p>We could not process this request. Try again from the home page or create a fresh short URL.</p>
        <div class="hero-actions">
            <a class="hero-action hero-action-primary" th:href="@{/}">Go home</a>
            <a class="hero-action hero-action-secondary" th:href="@{/#create-short-url}">Create short URL</a>
        </div>
    </section>
</div>
</body>
</html>
