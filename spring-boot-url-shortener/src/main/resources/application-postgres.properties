# Activate with: SPRING_PROFILES_ACTIVE=postgres
# Docker and deployment environments provide these values without committing secrets.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/url_shortener}
spring.datasource.username=${DATABASE_USERNAME:url_shortener}
spring.datasource.password=${DATABASE_PASSWORD:url_shortener}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
